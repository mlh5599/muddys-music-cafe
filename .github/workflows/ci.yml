name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make lint
      - run: make test
      # Includes the migration fixtures: current code must open every frozen
      # release database in server/internal/storage/testdata.
      - name: Rollback hook tests
        run: deploy/test-rollback-db.sh
      - name: Shell scripts
        run: shellcheck deploy/*.sh scripts/*.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t muddys-music-cafe:ci .
      - name: Smoke test the built image
        run: scripts/smoke-test.sh muddys-music-cafe:ci
