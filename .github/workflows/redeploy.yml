# Emergency path: redeploy an existing release tag's signed image through the
# same host-side script. It builds nothing; it only picks an image that already
# shipped.
name: Redeploy a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v2026.11.01.1
        required: true
permissions:
  contents: read
  packages: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the digest of that release
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::not a release tag"; exit 1; }
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:$TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  redeploy:
    needs: resolve
    runs-on: [self-hosted, linux, deploy]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: sudo -n -u deploy /usr/local/lib/deploy-kit/deploy-app.sh muddys "$TAG" "$DIGEST"
